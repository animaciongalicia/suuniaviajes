<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer petals (gold/orange outline) -->
  <g stroke="#E8941A" stroke-width="2.5" fill="none">
    <!-- Top petal -->
    <path d="M100 30 C85 55, 80 80, 100 105 C120 80, 115 55, 100 30Z"/>
    <!-- Top-right petal -->
    <path d="M140 45 C120 60, 110 80, 100 105 C125 95, 140 75, 140 45Z"/>
    <!-- Bottom-right petal -->
    <path d="M150 90 C130 85, 115 90, 100 105 C120 110, 140 105, 150 90Z"/>
    <!-- Bottom-left petal -->
    <path d="M50 90 C70 85, 85 90, 100 105 C80 110, 60 105, 50 90Z"/>
    <!-- Top-left petal -->
    <path d="M60 45 C80 60, 90 80, 100 105 C75 95, 60 75, 60 45Z"/>
  </g>
  <!-- Inner petals (white) -->
  <g stroke="#ffffff" stroke-width="2.5" fill="none">
    <!-- Top petal inner -->
    <path d="M100 45 C90 62, 87 80, 100 100 C113 80, 110 62, 100 45Z"/>
    <!-- Top-right inner -->
    <path d="M130 58 C117 67, 110 82, 100 100 C118 92, 130 78, 130 58Z"/>
    <!-- Right inner -->
    <path d="M138 88 C125 85, 112 90, 100 100 C115 105, 130 100, 138 88Z"/>
    <!-- Left inner -->
    <path d="M62 88 C75 85, 88 90, 100 100 C85 105, 70 100, 62 88Z"/>
    <!-- Top-left inner -->
    <path d="M70 58 C83 67, 90 82, 100 100 C82 92, 70 78, 70 58Z"/>
  </g>
</svg>
